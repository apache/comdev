name: Static checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  prek:
    name: prek (pre-commit hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # Full history so PRs can diff against the base commit below.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run prek
        env:
          # On PRs the lock-file check runs in the next step, on changed files only.
          SKIP: ${{ github.event_name == 'pull_request' && 'package-lock-sync' || '' }}
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Check package lock sync (changed files only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx prek run package-lock-sync --from-ref "$BASE_SHA" --to-ref HEAD
